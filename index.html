<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1eb">
  <meta name="description" content="Park Siwoo photo archive. 2019–2024 (estimated).">
  <title>Park Siwoo — Photo Archive</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f1eb;
      --paper-deep: #efe2d9;
      --ink: #252123;
      --muted: #716765;
      --rose: #ac6568;
      --burgundy: #6f2f37;
      --line: rgba(111, 47, 55, .2);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scrollbar-gutter: stable; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--burgundy); outline-offset: 6px; }
    [hidden] { display: none !important; }
    .skip-link { position: fixed; top: -5rem; left: 1rem; z-index: 5; padding: .8rem 1rem; background: var(--burgundy); color: white; }
    .skip-link:focus { top: 1rem; }
    .page { width: min(100%, 2000px); margin: auto; padding: 0 clamp(20px, 4vw, 72px); }
    .masthead { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; padding: clamp(38px, 5vw, 72px) 0 30px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-weight: 400; }
    .name { display: block; font: 400 clamp(48px, 5.6vw, 82px)/.95 var(--serif); letter-spacing: -.055em; }
    .archive-label { display: block; margin-top: 17px; color: var(--burgundy); font: 500 14px/1.4 var(--sans); letter-spacing: .22em; text-transform: uppercase; }
    .period { margin: 0 0 1px; color: var(--muted); font-size: 14px; line-height: 1.6; white-space: nowrap; }
    .period span { color: var(--rose); }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: clamp(14px, 1.7vw, 28px); row-gap: clamp(30px, 4vw, 64px); padding: 32px 0 64px; }
    .photo { min-width: 0; padding: 0; border: 0; background: none; cursor: zoom-in; text-align: left; align-self: start; }
    .photo-frame { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 3 / 4; background: var(--paper-deep); overflow: hidden; }
    .photo img { display: block; width: 100%; height: 100%; object-fit: contain; transition: opacity .25s; }
    .photo img, .viewer-image { pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
    .photo, .viewer { -webkit-touch-callout: none; }
    .photo-number { display: block; padding-top: 11px; color: var(--rose); font-size: 12px; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
    .photo-error { padding: 24px; color: var(--muted); font-size: 14px; }
    @media (hover: hover) { .photo:hover img { opacity: .86; } }
    .end-mark { width: 36px; height: 1px; margin: 0 auto 40px; background: var(--rose); }
    .viewer { position: fixed; inset: 0; width: 100%; max-width: none; height: 100%; height: 100dvh; max-height: none; margin: 0; padding: 0; border: 0; background: #211b1df5; color: var(--paper); overflow: hidden; }
    .viewer::backdrop { background: #211b1d; }
    .viewer[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .viewer-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: max(12px, env(safe-area-inset-top)) 20px 10px; }
    .viewer-title { margin: 0; font: 400 22px/1 var(--serif); letter-spacing: -.035em; }
    .icon-button { display: grid; place-items: center; flex-shrink: 0; width: 48px; height: 48px; border: 1px solid #f7f1eb33; border-radius: 50%; padding: 12px; background: transparent; color: var(--paper); cursor: pointer; }
    .icon-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.4; }
    .icon-button:disabled { opacity: .25; cursor: default; }
    .icon-button:focus-visible { outline-color: var(--paper); outline-offset: 3px; }
    @media (hover: hover) { .icon-button:hover:not(:disabled) { background: #f7f1eb15; } }
    .viewer-stage { min-height: 0; display: flex; align-items: center; justify-content: center; margin: 0; padding: 8px 80px; touch-action: pan-y pinch-zoom; }
    .viewer-image { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    .viewer-status { color: var(--paper); font-size: 16px; }
    .viewer-bottom { display: flex; justify-content: center; align-items: center; gap: 28px; padding: 16px 20px max(20px, env(safe-area-inset-bottom)); }
    .counter { min-width: 80px; text-align: center; color: #e4d4d0; font-size: 14px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
    @media (min-width: 1600px) { .gallery { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    @media (min-width: 761px) and (max-width: 1023px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 760px) {
      .page { padding: 0 20px; }
      .masthead { display: block; padding-top: 40px; padding-bottom: 24px; }
      .name { font-size: clamp(44px, 12vw, 66px); }
      .archive-label { margin-top: 14px; }
      .period { margin-top: 18px; }
      .gallery { grid-template-columns: minmax(0, 1fr); padding-top: 24px; row-gap: 32px; }
      .photo-frame { aspect-ratio: auto; }
      .photo img { height: auto; }
      .photo-frame:has(.photo-error:not([hidden])) { min-height: 200px; }
      .viewer-bar { padding-right: 14px; padding-left: 20px; }
      .viewer-stage { padding: 0 10px; }
      .viewer-bottom { gap: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
    @media print { .gallery, .viewer { display: none !important; } }
  </style>
</head>

        <span class="photo-frame"><img src="./siwoo2/siwoo161.jpeg" alt="Park Siwoo — photo 161" width="1158" height="1440" loading="lazy" decoding="async" draggable="false"><span class="photo-error" hidden>Photo unavailable</span></span>
        <span class="photo-number" aria-hidden="true">161</span>
      </button>
      <button class="photo" type="button" aria-label="Open photo 163" aria-haspopup="dialog">
        <span class="photo-frame"><img src="./siwoo2/siwoo163.jpeg" alt="Park Siwoo — photo 163" width="1290" height="1290" loading="lazy" decoding="async" draggable="false"><span class="photo-error" hidden>Photo unavailable</span></span>
        <span class="photo-number" aria-hidden="true">163</span>
      </button>
    </div>
    <div class="end-mark" aria-hidden="true"></div>
  </main>
  <dialog class="viewer" aria-label="Photo viewer">
    <div class="viewer-bar">
      <p class="viewer-title">Park Siwoo</p>
      <button class="icon-button" id="close-viewer" type="button" aria-label="Close photo" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <figure class="viewer-stage">
      <img class="viewer-image" alt="" draggable="false">
      <span class="viewer-status" role="status" hidden>Photo unavailable</span>
    </figure>
    <div class="viewer-bottom">
      <button class="icon-button" id="previous-photo" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
      <span class="counter" aria-live="polite" aria-atomic="true"></span>
      <button class="icon-button" id="next-photo" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
    </div>
  </dialog>
  <script>
    (() => {
      'use strict';
      const cards = [...document.querySelectorAll('.photo')];
      const viewer = document.querySelector('.viewer');
      const largeImage = document.querySelector('.viewer-image');
      const stage = document.querySelector('.viewer-stage');
      const status = document.querySelector('.viewer-status');
      const counter = document.querySelector('.counter');
      const previous = document.querySelector('#previous-photo');
      const next = document.querySelector('#next-photo');
      const close = document.querySelector('#close-viewer');
      let current = 0;
      let opener = null;
      let scrollPosition = 0;
      let bodyStyle = '';
      let gesture = null;
      let lastSwipe = 0;

      function showPhoto(index) {
        current = Math.max(0, Math.min(cards.length - 1, index));
        const thumbnail = cards[current].querySelector('img');
        largeImage.hidden = false;
        status.hidden = true;
        largeImage.alt = thumbnail.alt;
        largeImage.src = thumbnail.getAttribute('src');
        counter.textContent = `${String(current + 1).padStart(3, '0')} / ${cards.length}`;
        previous.disabled = current === 0;
        next.disabled = current === cards.length - 1;
      }

      function openPhoto(index, button) {
        opener = button;
        scrollPosition = window.scrollY;
        bodyStyle = document.body.style.cssText;
        showPhoto(index);
        viewer.showModal();
        Object.assign(document.body.style, { position: 'fixed', top: `-${scrollPosition}px`, width: '100%', overflow: 'hidden' });
        close.focus({ preventScroll: true });
      }

      cards.forEach((button, index) => {
        button.addEventListener('click', () => openPhoto(index, button));
        const img = button.querySelector('img');
        const showError = () => { img.hidden = true; button.querySelector('.photo-error').hidden = false; };
        img.addEventListener('error', showError);
        if (img.complete && img.naturalWidth === 0) showError();
      });
      largeImage.addEventListener('error', () => { largeImage.hidden = true; status.hidden = false; });
      close.addEventListener('click', () => viewer.close());
      previous.addEventListener('click', () => showPhoto(current - 1));
      next.addEventListener('click', () => showPhoto(current + 1));
      viewer.addEventListener('close', () => {
        document.body.style.cssText = bodyStyle;
        window.scrollTo(0, scrollPosition);
        opener?.focus({ preventScroll: true });
        largeImage.removeAttribute('src');
        gesture = null;
      });
      viewer.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        const actions = { ArrowLeft: () => showPhoto(current - 1), ArrowRight: () => showPhoto(current + 1), Home: () => showPhoto(0), End: () => showPhoto(cards.length - 1) };
        if (actions[event.key]) { event.preventDefault(); actions[event.key](); }
      });
      stage.addEventListener('click', event => {
        if (Date.now() - lastSwipe < 400) return;
        const rect = largeImage.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) viewer.close();
      });
      stage.addEventListener('touchstart', event => {
        gesture = event.touches.length === 1 ? { x: event.touches[0].clientX, y: event.touches[0].clientY } : null;
      }, { passive: true });
      stage.addEventListener('touchmove', event => { if (event.touches.length > 1) gesture = null; }, { passive: true });
      stage.addEventListener('touchcancel', () => { gesture = null; }, { passive: true });
      stage.addEventListener('touchend', event => {
        if (!gesture || !event.changedTouches.length) return;
        const dx = event.changedTouches[0].clientX - gesture.x;
        const dy = event.changedTouches[0].clientY - gesture.y;
        gesture = null;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          lastSwipe = Date.now();
          showPhoto(current + (dx < 0 ? 1 : -1));
        }
      }, { passive: true });

      // Discourage casual saving. Publicly displayed images cannot be made unsavable.
      for (const surface of [document.querySelector('.gallery'), viewer]) {
        surface.addEventListener('contextmenu', event => event.preventDefault());
        surface.addEventListener('dragstart', event => event.preventDefault());
      }
    })();
  </script>
</body>
</html>
